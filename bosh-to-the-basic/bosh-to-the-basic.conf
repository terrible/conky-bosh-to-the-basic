conky.config = {
    background = false,
    use_xft = true,
    xftalpha = 1.0,
    update_interval = 1.0,
    total_run_times = 0,
    temperature_unit = 'celsius',

    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_colour = '#50202020',
    own_window_argb_visual = true,
    own_window_argb_value = 64,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    alignment = 'top_right',
    xinerama_head = 1,
    minimum_width = 273,
    maximum_width = 273,
    minimum_height = 720,

    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    gap_x = 20,
    gap_y = 8,

    no_buffers = true,
    uppercase = false,

    cpu_avg_samples = 12,
    net_avg_samples = 2,

    use_spacer = 'none',
    text_buffer_size = 512,
    override_utf8_locale = true,

    default_color = 'd6dde5',
    default_shade_color = 'darkgray',
    default_outline_color = 'darkgray',

    color2 = '2b96c0',
    color3 = 'ffb454',
    color4 = 'ff5555',

    lua_load = '@CONKY_DIR@/lua/bosh-to-the-basic.lua',
    lua_draw_hook_pre = 'conky_main'
};

conky.text = [[
${alignc}${color2}${font NotoSans:bold:size=10}${execi 3600 @CONKY_DIR@/scripts/distro-info.sh} · KDE PLASMA
${alignc}${color}${font NotoSans:size=9}${time %A %d %b %Y}
${alignc}${color}${font NotoSans:size=9}Uptime: ${uptime_short}${color}

${color2}${font NotoSans:bold:size=10}SISTEMA${color}
${font NotoSans:size=9}RAM ${alignr}${mem} / ${memmax}
${membar 4,259}
${font NotoSans:size=9}SWAP ${alignr}${swap} / ${swapmax}
${swapbar 4,259}

${color2}${font NotoSans:bold:size=10}PROCESADOR${color}
${font NotoSans:size=9}CPU TOTAL ${alignr}${cpu}%
${cpubar 4,259}

${color2}${font NotoSans:bold:size=10}GPU${color}
${font NotoSans:size=9}GPU MEMORY ${alignr}${execi 5 @CONKY_DIR@/scripts/gpu-metric.sh memory}
${execibar 4,259 @CONKY_DIR@/scripts/gpu-metric.sh memory_percent}
${font NotoSans:size=9}GPU INTEL LOAD ${alignr}${execi 5 @CONKY_DIR@/scripts/intel-gpu-metric.sh}%
${execibar 4,259 @CONKY_DIR@/scripts/intel-gpu-metric.sh}
${font NotoSans:size=9}GPU NVIDIA LOAD ${alignr}${execi 5 @CONKY_DIR@/scripts/gpu-metric.sh util}%
${execibar 4,259 @CONKY_DIR@/scripts/gpu-metric.sh util}

${color2}${font NotoSans:bold:size=10}TEMPERATURA${color}
${font NotoSans:size=9}PACKAGE ${alignr}${execi 5 @CONKY_DIR@/scripts/cpu-temp.sh package}°C
${font NotoSans:size=9}CPU ${alignr}${execi 5 @CONKY_DIR@/scripts/cpu-temp.sh avg}°C
${font NotoSans:size=9}GPU ${alignr}${execi 5 @CONKY_DIR@/scripts/gpu-metric.sh temp}°C

${color2}${font NotoSans:bold:size=10}ALMACENAMIENTO${color}
${font NotoSans:size=9}/ ${alignr}${fs_used /} / ${fs_size /}
${font NotoSans:size=9}Libre: ${fs_free /} (${fs_free_perc /}%)
${fs_bar_free 4,259 /}
${font NotoSans:size=9}/home ${alignr}${fs_used /home} / ${fs_size /home}
${font NotoSans:size=9}Libre: ${fs_free /home} (${fs_free_perc /home}%)
${fs_bar_free 4,259 /home}

${execpi 10 @CONKY_DIR@/scripts/network-info.sh}

${color2}${font NotoSans:bold:size=10}PROCESOS${color}
${font NotoSans:bold:size=8}Nombre ${alignr}PID   CPU   MEM
${font NotoSans:size=9}${top name 1} ${alignr}${top pid 1}  ${top cpu 1}  ${top mem 1}
${top name 2} ${alignr}${top pid 2}  ${top cpu 2}  ${top mem 2}
${top name 3} ${alignr}${top pid 3}  ${top cpu 3}  ${top mem 3}
${top name 4} ${alignr}${top pid 4}  ${top cpu 4}  ${top mem 4}
${top name 5} ${alignr}${top pid 5}  ${top cpu 5}  ${top mem 5}
]];
