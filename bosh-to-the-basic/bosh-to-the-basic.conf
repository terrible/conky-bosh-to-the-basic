-- Conky parses this configuration as Lua before creating the window.
local theme_dir = '@CONKY_DIR@'
local hook = theme_dir .. '/lua/bosh-to-the-basic.lua'
-- A trailing delimiter makes spaces literal on current Conky.
if hook:find(' ', 1, true) then hook = hook .. ';' end

local palette = {
    text = 'd6dde5', blue = '2b96c0', yellow = 'ffd54f', red = 'ff5555',
    white = 'FFFFFF', background = '#40202020',
}
local columns = {}
local stat = io.open('/proc/stat', 'r')
if stat then
    for line in stat:lines() do
        if line:match('^cpu%d+%s') then
            local n = #columns + 1
            columns[n] = ('${goto %d}${cpubar cpu%d 4,58}'):format(5 + (n-1)*67, n)
            if n == 4 then break end
        end
    end
    stat:close()
end

conky.config = {
    -- Select X11 explicitly; the installer falls back for older Conky builds.
    output_backend = 'x11',
    top_name_width = 19,
    background = false,
    use_xft = true,
    font = 'NotoSans:size=9',
    xftalpha = 1.0,
    update_interval = 1.0,
    total_run_times = 0,
    temperature_unit = 'celsius',

    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_colour = palette.background,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    alignment = 'top_right',
    xinerama_head = 1,
    minimum_width = 273,
    maximum_width = 273,
    minimum_height = 720,

    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    gap_x = 20,
    gap_y = 8,

    no_buffers = true,
    uppercase = false,

    cpu_avg_samples = 12,
    net_avg_samples = 2,

    use_spacer = 'none',
    text_buffer_size = 2048,
    override_utf8_locale = true,

    default_color = palette.text,
    default_shade_color = 'darkgray',
    default_outline_color = 'darkgray',

    color2 = palette.blue,
    color3 = palette.yellow,
    color4 = palette.red,

    lua_load = hook,
    lua_shutdown_hook = 'bosh_shutdown',
    template0 = ('${goto 5}${downspeedgraph %s 22,125 %s %s}${goto 139}${upspeedgraph %s 22,125 %s %s}')
        :format([[\1]], palette.yellow, palette.yellow, [[\1]], palette.blue, palette.blue),
};

conky.text = ([[
${alignc}${color2}${font NotoSans:bold:size=30}${time %H:%M:%S}${color}
${voffset -24}${alignc}${color}${font NotoSans:size=10}${time %A %d %b %Y}
${alignc}${color3}${font NotoSans:size=9}UPTIME: ${uptime_short}${color}

${color2}${font NotoSans:bold:size=10}SISTEMA${color}
${voffset 5}${font NotoSans:bold:size=9}CPU TOTAL${font NotoSans:size=9} ${alignr}${cpu}%
${cpubar 4,259}
${font NotoSans:size=8}${lua_parse bosh_center_row cpu @@CPU_COUNT@@}
${color2}@@CPU_BARS@@${color}
${cpugraph cpu0 22,259 @@BLUE@@ @@BLUE@@}
${voffset 12}${font NotoSans:bold:size=9}RAM${font NotoSans:size=9} ${alignr}${mem} / ${memmax}
${membar 4,259}
${if_match ${lua bosh_swap_present} > 0}${font NotoSans:size=9}SWAP ${alignr}${swap} / ${swapmax}
${swapbar 4,259}
${endif}
${color2}${font NotoSans:bold:size=10}GPU${color}
${execpi 5 /usr/bin/python3 -BEs "@CONKY_DIR@/scripts/temperature-panel.py" --all}

${color2}${font NotoSans:bold:size=10}ALMACENAMIENTO${color}
${font NotoSans:size=9}/ ${alignr}${fs_used /} / ${fs_size /}
${color @@WHITE@@}${fs_bar 4,259 /}${color}

${execpi 10 /usr/bin/bash "@CONKY_DIR@/scripts/network-info.sh"}

${color2}${font NotoSans:bold:size=10}PROCESOS${color}
${font NotoSans:bold:size=8}Nombre${goto 154}${color3}CPU %${goto 218}${color2}RAM %${color}
${font NotoSans:size=9}${top name 1}${goto 154}${color3}${top cpu 1}${goto 218}${color2}${top mem 1}${color}
${font NotoSans:size=9}${top name 2}${goto 154}${color3}${top cpu 2}${goto 218}${color2}${top mem 2}${color}
${font NotoSans:size=9}${top name 3}${goto 154}${color3}${top cpu 3}${goto 218}${color2}${top mem 3}${color}
${font NotoSans:size=9}${top name 4}${goto 154}${color3}${top cpu 4}${goto 218}${color2}${top mem 4}${color}
${font NotoSans:size=9}${top name 5}${goto 154}${color3}${top cpu 5}${goto 218}${color2}${top mem 5}${color}
]]):gsub('@@([%u_]+)@@', {
    CPU_COUNT = tostring(#columns), CPU_BARS = table.concat(columns),
    BLUE = palette.blue, WHITE = palette.white,
})
